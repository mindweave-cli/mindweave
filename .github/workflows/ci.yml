name: CI

on:
  push:
    # Branches only. A tag push points at a commit that has already been built, so
    # including tags ran the whole matrix a second time on the same code. The two
    # runs then competed for runners and one of them lost a timing-sensitive test
    # that the other passed, which reads as a flake and is really just self-inflicted
    # contention.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Never fetch a language server from a runner. Without this the chassis may try to
  # install one mid-test, which turns a code failure into a network failure.
  MINDWEAVE_NO_AUTO_INSTALL: "1"

jobs:
  # Windows is the job that decides whether a change is good: it is what Mindweave has been
  # built and tested on. macOS and Linux run below as a separate job that does NOT gate
  # anything (continue-on-error), because they have never been run here and a red result is
  # information about work still to do, not about the change that triggered it. When a platform
  # passes consistently it moves up into this job's matrix and starts to count.
  windows:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    # A hung test step would otherwise hold a runner for GitHub's six hour default.
    #
    # This was raised to 45 while chasing a run that kept being killed here, and that
    # was treating the symptom: the job was not slow, a test was hanging, and a bigger
    # ceiling only bought a longer wait for the same anonymous cancellation. The real
    # fix was --test-timeout in the test script, which fails a hung test by NAME.
    #
    # Back to 20 now the suite finishes in about four minutes here. Keep it tight: a
    # ceiling this job never approaches is the one that still means something when it
    # fires.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor declared in package.json engines: current LTS, the Node the
        # desktop app's Electron embeds, and it has the built-in WebSocket the page route
        # of `ui` talks over. "current" is the newest release, so a change that breaks
        # on it fails here first. Both run so a change needing a newer API fails here
        # rather than for a user on the minimum supported version.
        node: ["24", "current"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Facts about the machine, as ANNOTATIONS so they can be read without admin
      # rights or a browser. Every wrong guess about why this build differs from a
      # developer's machine cost a round trip; these are the things that actually
      # differ (core count decides test concurrency, and ripgrep is the primary
      # search engine and is NOT on this image).
      - name: Environment facts
        shell: bash
        run: |
          rg_path=$(command -v rg || echo "NOT INSTALLED")
          echo "::notice title=Env::node=$(node -v) cores=$(node -p 'require("os").availableParallelism()') rg=${rg_path} tmp=${RUNNER_TEMP} os=${RUNNER_OS}"

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        # pipefail matters: without it `tee` decides the exit code and a failing
        # suite reports success.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # Search has TWO engines and picks one from what is installed, so a single run
      # only ever covers one of them. The runners have no ripgrep, so the suite above
      # is the built-in walker; this installs ripgrep and runs the search tests again
      # to cover the other path. The two drifted apart once already (only ripgrep
      # honoured .gitignore until v1.9.3) and nothing caught it, because no machine
      # ran both.
      - name: Test the ripgrep search path
        shell: bash
        run: |
          set -o pipefail
          choco install ripgrep -y --no-progress --limit-output
          rg --version
          node --import tsx --test \
            src/tools/tools.test.ts \
            src/tools/codeIntel.test.ts \
            src/tools/multiroot.test.ts 2>&1 | tee rg-output.txt

      # Failures as ANNOTATIONS, not only the run summary. The summary is rendered by
      # JavaScript and full logs need admin rights on the API, so neither can be read
      # from outside a browser. Annotations come back from the public checks API, and
      # that difference decides whether a red build can be diagnosed at all.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          while IFS= read -r line; do
            echo "::error title=Test failed::${line}"
          done < <(grep -E "^not ok " test-output.txt | head -25)
          while IFS= read -r line; do
            echo "::error title=Assertion::${line}"
          done < <(grep -E "^ +(AssertionError|Error|code|expected|actual|operator):" test-output.txt | head -30)
          counts=$(grep -E "^# (tests|pass|fail|skipped)" test-output.txt | tr '\n' ' ')
          echo "::error title=Suite totals::${counts:-suite produced no totals, it may have crashed}"
          {
            echo "## Failing tests"
            echo '```'
            grep -E "^not ok |^# (tests|pass|fail|skipped)" test-output.txt | head -80 || echo "(none found: the suite may have crashed before reporting)"
            echo '```'
            echo "### First assertions"
            echo '```'
            grep -A 12 -m 3 "^not ok " test-output.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  # macOS and Linux: a first look at how much works there. Advisory, see the note above `windows`.
  # One Node version each (the floor), so the extra runners stay cheap.
  unix:
    name: ${{ matrix.name }} / Node 24 (advisory)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Environment facts
        run: |
          rg_path=$(command -v rg || echo "NOT INSTALLED")
          echo "::notice title=Env::node=$(node -v) cores=$(node -p 'require("os").availableParallelism()') rg=${rg_path} tmp=${RUNNER_TEMP} os=${RUNNER_OS} arch=${RUNNER_ARCH} shell=${SHELL}"

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # pipefail so a failing suite is not reported as success by `tee`.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # The second search engine, as on Windows: the suite above runs the built-in walker, this installs
      # ripgrep and runs the search tests again.
      - name: Test the ripgrep search path
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get install -y ripgrep; fi
          rg --version
          node --import tsx --test \
            src/tools/tools.test.ts \
            src/tools/codeIntel.test.ts \
            src/tools/multiroot.test.ts 2>&1 | tee rg-output.txt

      - name: Report failures
        if: failure()
        run: |
          while IFS= read -r line; do
            echo "::warning title=Test failed (${RUNNER_OS})::${line}"
          done < <(grep -E "^not ok " test-output.txt | head -40)
          counts=$(grep -E "^# (tests|pass|fail|skipped)" test-output.txt | tr '\n' ' ')
          echo "::warning title=Suite totals (${RUNNER_OS})::${counts:-suite produced no totals, it may have crashed}"
          {
            echo "## Failing tests on ${RUNNER_OS}"
            echo '```'
            grep -E "^not ok |^# (tests|pass|fail|skipped)" test-output.txt | head -120 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
